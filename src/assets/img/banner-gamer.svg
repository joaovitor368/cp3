<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Banner gamer</title>
  <desc id="desc">Setup gamer com monitor, teclado, mouse e luzes neon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#090d1a"/>
      <stop offset=".55" stop-color="#101a34"/>
      <stop offset="1" stop-color="#1b1636"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#35d7ff"/>
      <stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="780" fill="url(#bg)"/>
  <circle cx="1050" cy="210" r="190" fill="#35d7ff" opacity=".16"/>
  <circle cx="1180" cy="580" r="180" fill="#ff4ecd" opacity=".13"/>
  <path d="M670 110h475c42 0 76 34 76 76v292c0 42-34 76-76 76H670c-42 0-76-34-76-76V186c0-42 34-76 76-76Z" fill="#07101f" stroke="#35d7ff" stroke-width="8"/>
  <path d="M650 158h515v323H650z" fill="url(#screen)" opacity=".88" filter="url(#glow)"/>
  <path d="M770 554h270l54 112H716z" fill="#07101f" stroke="#ff4ecd" stroke-width="7"/>
  <rect x="510" y="665" width="790" height="56" rx="16" fill="#07101f" stroke="#a7ff3d" stroke-width="5"/>
  <path d="M220 585c120-72 248-86 398-48 162 42 314 42 475-18 88-33 168-39 250-16v277H0V655c76-8 148-28 220-70Z" fill="#050814" opacity=".85"/>
  <path d="M420 628h380" stroke="#35d7ff" stroke-width="9" stroke-linecap="round"/>
  <path d="M875 628h250" stroke="#ff4ecd" stroke-width="9" stroke-linecap="round"/>
  <g opacity=".7" stroke="#a7ff3d" stroke-width="5" fill="none">
    <path d="M105 130h240"/>
    <path d="M105 182h310"/>
    <path d="M105 234h190"/>
  </g>
